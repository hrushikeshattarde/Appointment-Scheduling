# The server: the board (app), HTTPS in front of it (caddy) and a continuous copy of its store in
# S3 (litestream). Started by deploy/pickup-booking.service with
#   docker compose --env-file /etc/pickup-booking/compose.env up -d --build
# compose.env holds HOST_NAME, BACKUP_BUCKET and AWS_REGION (written by deploy/install.sh); the
# app's own settings are /etc/pickup-booking/app.env (written by deploy/fetch-env.sh).
#
# Host networking: the board listens on 127.0.0.1:8000 only, Caddy on 80 and 443, and every
# container reaches the instance's IAM role directly.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pickup-booking:local
    network_mode: host
    env_file: /etc/pickup-booking/app.env
    volumes:
      - /var/lib/pickup-booking:/data
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: pickup-booking-app

  litestream:
    image: litestream/litestream:0.3.13
    network_mode: host
    command: replicate
    environment:
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - /var/lib/pickup-booking:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: pickup-booking-litestream

  caddy:
    image: caddy:2.8.4
    network_mode: host
    environment:
      HOST_NAME: ${HOST_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: pickup-booking-caddy

volumes:
  caddy-data: {}
  caddy-config: {}
