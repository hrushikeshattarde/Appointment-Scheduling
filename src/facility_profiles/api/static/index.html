<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pickup appointments</title>
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#overview" aria-label="Pickup appointments, today">Pickup appointments</a>
      <nav class="tabs" aria-label="Pages">
        <a href="#overview" data-tab="overview">Today <span id="attention-count" class="count" hidden></span></a>
        <a href="#appointments" data-tab="appointments">All pickups</a>
        <a href="#week" data-tab="week">Calendar</a>
        <a href="#access" data-tab="access" id="access-tab" hidden>Access</a>
      </nav>
      <div class="tools">
        <label>Customer
          <select id="customer"><option value="">All customers</option></select>
        </label>
        <label id="me-label">Your name
          <input id="me" type="text" placeholder="for the record" autocomplete="name" size="12" />
        </label>
        <span id="who" class="who" hidden></span>
        <form id="signout" method="post" action="/auth/logout" hidden>
          <button class="btn small" type="submit">Sign out</button>
        </form>
        <button id="refresh" class="btn small" type="button" title="Load the latest">Refresh</button>
        <span id="stamp" class="stamp" aria-live="polite"></span>
      </div>
    </header>
    <main id="view" tabindex="-1"><p class="muted">Loading&hellip;</p></main>
    <div id="scrim" class="scrim" hidden></div>
    <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="case-title" hidden></aside>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
