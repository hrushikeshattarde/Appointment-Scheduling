[project]
name = "facility-profiles"
version = "0.1.0"
description = "Idea 1 of the Appointment Scheduling Automation programme: builds scored facility scheduling profiles from Transport Pro load, dispatch and note data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Circle Logistics" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "anthropic>=1.7,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.6,<3",
  "rapidfuzz>=3.10,<4",
  "sqlalchemy>=2.0.36,<3",
  "structlog>=24.4,<26",
  "tenacity>=9.0,<10",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
facility-profiles = "facility_profiles.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.8",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facility_profiles"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PL", "RUF", "S", "T20", "PT", "RET", "ARG", "ERA", "TID", "D"]
ignore = [
  "D100", "D104", "D105", "D107", "D203", "D213",
  "PLR0911", "PLR0913", "PLR0915", "PLR2004", "S101", "S311",
  "RUF012", "TID252", "UP046",
]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "PLR", "ARG", "T20", "E501", "PT017", "PT018", "PLC0415", "SIM105", "C408"]
"src/facility_profiles/cli.py" = ["T20", "PLC0415", "PLR0917"]
"src/facility_profiles/api/app.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["facility_profiles"]

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=facility_profiles --cov-report=term-missing:skip-covered --cov-fail-under=80"
filterwarnings = ["error::DeprecationWarning:facility_profiles.*"]

[tool.coverage.run]
branch = true
source = ["facility_profiles"]
omit = ["src/facility_profiles/api/*"]
